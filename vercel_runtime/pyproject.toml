[project]
name = "plane-telegram-bot-vercel"
version = "3.3.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.137.0",
  "python-telegram-bot[webhooks,job-queue]>=21.5",
  "motor>=3.3.0",
  "pymongo[srv]>=4.9.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.0",
  "geohash2>=1.1",
  "astral>=3.2",
  "apscheduler>=3.10.4",
  "psutil>=5.9.0",
  "structlog>=24.4.0",
  "vercel-workflow==0.9.0",
  "PyJWT[crypto]>=2.10.1",
]

[[tool.vercel.workflows]]
entrypoint = "plane_workflows:wf"
