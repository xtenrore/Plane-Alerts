services:
  mongo:
    image: mongo:7.0.14
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  plane-alerts:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: "8000"
      PREDICTION_LAB_ROOT: /data/prediction_lab
    volumes:
      - prediction_lab_data:/data/prediction_lab
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PLANE_ALERTS_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  mongo_data:
  prediction_lab_data:
