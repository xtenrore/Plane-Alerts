name: Deploy Plane Alerts to Railway

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
  # Explicit exact-SHA recovery path for a runtime commit whose normal
  # workflow_run deployment was safely skipped by an earlier classifier bug.
  push:
    branches:
      - "automation/railway-deploy-*"

permissions:
  contents: read
  actions: read

concurrency:
  group: plane-alerts-railway-production
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/automation/railway-deploy-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy: ${{ steps.runtime.outputs.deploy }}
      tested_sha: ${{ steps.candidate.outputs.sha }}
    env:
      EVENT_KIND: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
      TRIGGER_SHA: ${{ github.sha }}
      WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout deployment trigger commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve and verify exact current-main application-tested SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_KIND" == "workflow_run" ]]; then
            DEPLOY_SHA="$WORKFLOW_RUN_SHA"
          else
            PREFIX="automation/railway-deploy-"
            [[ "$REF_NAME" == "$PREFIX"* ]] || { echo "Unexpected Railway deploy trigger branch." >&2; exit 1; }
            DEPLOY_SHA="${REF_NAME#"$PREFIX"}"
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Branch suffix must be a full 40-character tested SHA." >&2; exit 1; }
            PARENTS="$(git show -s --format=%P "$TRIGGER_SHA")"
            [[ "$PARENTS" == "$DEPLOY_SHA" ]] || {
              echo "Railway deploy trigger must be a direct child of the tested SHA." >&2
              exit 1
            }
            TRIGGER_TREE="$(git rev-parse "$TRIGGER_SHA^{tree}")"
            TESTED_TREE="$(git rev-parse "$DEPLOY_SHA^{tree}")"
            [[ "$TRIGGER_TREE" == "$TESTED_TREE" ]] || {
              echo "Railway deploy trigger branch changed the tested source tree." >&2
              exit 1
            }
          fi

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid tested SHA." >&2; exit 1; }
          git fetch origin main --no-tags
          MAIN_SHA="$(git rev-parse origin/main)"
          [[ "$MAIN_SHA" == "$DEPLOY_SHA" ]] || {
            echo "Refusing stale Railway candidate: candidate=$DEPLOY_SHA current_main=$MAIN_SHA" >&2
            exit 1
          }
          git checkout --detach "$DEPLOY_SHA"
          [[ "$(git rev-parse HEAD)" == "$DEPLOY_SHA" ]]

          TEST_WORKFLOW_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml" --jq '.id')"
          TEST_RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$TEST_WORKFLOW_ID/runs?per_page=100")"
          TEST_RUN="$(jq -c --arg sha "$DEPLOY_SHA" '
            [.workflow_runs[]
              | select(.event == "push" and .head_branch == "main" and .head_sha == $sha)
            ]
            | sort_by(.updated_at)
            | last // empty
          ' <<< "$TEST_RUNS")"
          [[ -n "$TEST_RUN" ]] || {
            echo "No full application CI run exists for exact main SHA $DEPLOY_SHA." >&2
            exit 1
          }
          TEST_RUN_ID="$(jq -r '.id' <<< "$TEST_RUN")"
          [[ "$(jq -r '.status' <<< "$TEST_RUN")" == "completed" && "$(jq -r '.conclusion' <<< "$TEST_RUN")" == "success" ]] || {
            echo "Latest exact-SHA application CI run is not successful." >&2
            exit 1
          }
          TEST_JOBS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID/jobs?per_page=100")"
          PYTEST_JOB="$(jq -c '[.jobs[] | select(.name == "pytest")] | first // empty' <<< "$TEST_JOBS")"
          [[ -n "$PYTEST_JOB" ]] || { echo "Missing pytest job in exact-SHA application CI." >&2; exit 1; }
          [[ "$(jq -r '.conclusion' <<< "$PYTEST_JOB")" == "success" ]] || { echo "Exact-SHA pytest job did not pass." >&2; exit 1; }
          FULL_SUITE="$(jq -r '[.steps[] | select(.name == "Run full test suite") | .conclusion] | first // empty' <<< "$PYTEST_JOB")"
          [[ "$FULL_SUITE" == "success" ]] || { echo "Exact-SHA full test suite did not pass." >&2; exit 1; }

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "Verified Railway candidate $DEPLOY_SHA with application CI run $TEST_RUN_ID."

      - name: Confirm current main and classify Railway runtime changes
        id: runtime
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$CURRENT_MAIN_SHA" != "$DEPLOY_SHA" ]]; then
            echo "A newer main commit exists; refusing to deploy stale tested SHA $DEPLOY_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARENT_SHA="$(git rev-parse "${DEPLOY_SHA}^1")"
          CHANGED_FILES="$(git diff --name-only "$PARENT_SHA" "$DEPLOY_SHA")"
          RUNTIME_CHANGED=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              app/version.py)
                # A community release-version bump and its release-history
                # comments do not change the already-tested Railway runtime.
                # Any other executable/version-model change still deploys.
                if git diff -U0 "$PARENT_SHA" "$DEPLOY_SHA" -- "$file" |
                  grep -E '^[+-][^+-]' |
                  grep -Ev '^[+-](VERSION = "[0-9]+\.[0-9]+\.[0-9]+"|#)' |
                  grep -q .; then
                  RUNTIME_CHANGED=true
                fi
                ;;
              app/*)
                # File-mode-only changes to Python modules are not runtime
                # changes. Any actual content change remains a Railway gate.
                if git diff --numstat "$PARENT_SHA" "$DEPLOY_SHA" -- "$file" |
                  awk '$1 != "0" || $2 != "0" { changed=1 } END { exit !changed }'; then
                  RUNTIME_CHANGED=true
                fi
                ;;
              worker.py|Dockerfile|requirements.txt|pyproject.toml|vercel_runtime/*|scripts/planealerts|scripts/railway-entrypoint.sh|scripts/build_airport_database.py|data/aviation/*)
                RUNTIME_CHANGED=true
                ;;
              requirements.lock)
                # Package names begin with an alphanumeric or underscore.
                # This POSIX ERE deliberately avoids a malformed bracket range.
                if git diff -U0 "$PARENT_SHA" "$DEPLOY_SHA" -- requirements.lock | grep -Eq '^[+-][[:alnum:]_]'; then
                  RUNTIME_CHANGED=true
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ "$RUNTIME_CHANGED" != "true" ]]; then
            echo "No Railway runtime-impacting files changed; this is a community/docs/installer-only commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Railway runtime-impacting changes detected."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      MAIN_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      WORKSPACE_ID: 3fcd544c-7798-4d82-b331-8ea8294ad9e5
      DEPLOY_SHA: ${{ needs.gate.outputs.tested_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tested_sha }}

      - name: Embed tested commit metadata
        shell: sh
        run: |
          set -eu
          printf '%s\n' "$DEPLOY_SHA" > app/build_commit.txt

      - name: Resolve Railway authentication
        shell: sh
        run: |
          set -eu
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "Using Railway project-token mode."
            exit 0
          fi
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::Missing RAILWAY_TOKEN or RAILWAY_API_TOKEN GitHub secret."
            exit 1
          fi
          if railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --workspace "$WORKSPACE_ID"; then
            echo "Using Railway API-token mode."
            exit 0
          fi
          echo "Railway API-token link was rejected; trying project-token compatibility mode."
          echo "RAILWAY_TOKEN=$RAILWAY_API_TOKEN" >> "$GITHUB_ENV"
          echo "RAILWAY_API_TOKEN=" >> "$GITHUB_ENV"

      - name: Ensure persistent Prediction Lab volume
        shell: sh
        run: |
          set -eu
          VOLUMES="$(railway volume --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" list --json)"
          if printf '%s' "$VOLUMES" | grep -q '/data/prediction_lab'; then
            echo "Prediction Lab persistent volume already attached."
          else
            echo "Creating Prediction Lab persistent volume at /data/prediction_lab."
            railway volume --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" add --mount-path /data/prediction_lab --json
          fi

      - name: Deploy tested commit to main service
        shell: sh
        run: |
          set -eu
          railway up --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" --ci --message "Plane Alerts main ${DEPLOY_SHA}"
