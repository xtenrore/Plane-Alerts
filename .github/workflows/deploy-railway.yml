name: Deploy Plane Alerts to Railway

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: plane-alerts-railway-production
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.head.outputs.deploy }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm tested commit is still main head
        id: head
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${CURRENT_MAIN_SHA}" != "${DEPLOY_SHA}" ]]; then
            echo "A newer main commit exists; refusing to deploy stale tested SHA ${DEPLOY_SHA}."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      MAIN_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      WORKSPACE_ID: 3fcd544c-7798-4d82-b331-8ea8294ad9e5
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Embed tested commit metadata
        shell: sh
        run: |
          set -eu
          printf '%s\n' "$DEPLOY_SHA" > app/build_commit.txt

      - name: Resolve Railway authentication
        shell: sh
        run: |
          set -eu
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "Using Railway project-token mode."
            exit 0
          fi
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::Missing RAILWAY_TOKEN or RAILWAY_API_TOKEN GitHub secret."
            exit 1
          fi

          if railway link \
            --project "$PROJECT_ID" \
            --environment "$ENVIRONMENT_ID" \
            --workspace "$WORKSPACE_ID"; then
            echo "Using Railway API-token mode."
            exit 0
          fi

          echo "Railway API-token link was rejected; trying project-token compatibility mode."
          echo "RAILWAY_TOKEN=$RAILWAY_API_TOKEN" >> "$GITHUB_ENV"
          echo "RAILWAY_API_TOKEN=" >> "$GITHUB_ENV"

      - name: Deploy tested commit to main service
        shell: sh
        run: |
          set -eu
          railway up \
            --project "$PROJECT_ID" \
            --service "$MAIN_SERVICE_ID" \
            --environment "$ENVIRONMENT_ID" \
            --ci \
            --message "Plane Alerts main ${DEPLOY_SHA}"
