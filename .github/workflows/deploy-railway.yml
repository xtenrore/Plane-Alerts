name: Deploy Plane Alerts to Railway

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: plane-alerts-railway-production
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deploy: ${{ steps.runtime.outputs.deploy }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout tested commit for path classification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Confirm current main and classify Railway runtime changes
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "$CURRENT_MAIN_SHA" != "$DEPLOY_SHA" ]]; then
            echo "A newer main commit exists; refusing to deploy stale tested SHA $DEPLOY_SHA."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PARENT_SHA="$(git rev-parse "${DEPLOY_SHA}^1")"
          CHANGED_FILES="$(git diff --name-only "$PARENT_SHA" "$DEPLOY_SHA")"
          RUNTIME_CHANGED=false

          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            case "$file" in
              app/*|worker.py|Dockerfile|requirements.txt|pyproject.toml|vercel_runtime/*|scripts/planealerts|scripts/railway-entrypoint.sh|scripts/build_airport_database.py|data/aviation/*)
                RUNTIME_CHANGED=true
                ;;
              requirements.lock)
                # Ignore header/comment-only maintenance. A real pinned package
                # addition, removal or version change still requires Railway.
                if git diff -U0 "$PARENT_SHA" "$DEPLOY_SHA" -- requirements.lock | grep -Eq '^[+-][^+-#[:space:]]'; then
                  RUNTIME_CHANGED=true
                fi
                ;;
            esac
          done <<< "$CHANGED_FILES"

          if [[ "$RUNTIME_CHANGED" != "true" ]]; then
            echo "No Railway runtime-impacting files changed; this is a community/docs/installer-only commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Railway runtime-impacting changes detected."
          echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      MAIN_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      WORKSPACE_ID: 3fcd544c-7798-4d82-b331-8ea8294ad9e5
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Embed tested commit metadata
        shell: sh
        run: |
          set -eu
          printf '%s\n' "$DEPLOY_SHA" > app/build_commit.txt

      - name: Resolve Railway authentication
        shell: sh
        run: |
          set -eu
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "Using Railway project-token mode."
            exit 0
          fi
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "::error::Missing RAILWAY_TOKEN or RAILWAY_API_TOKEN GitHub secret."
            exit 1
          fi
          if railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --workspace "$WORKSPACE_ID"; then
            echo "Using Railway API-token mode."
            exit 0
          fi
          echo "Railway API-token link was rejected; trying project-token compatibility mode."
          echo "RAILWAY_TOKEN=$RAILWAY_API_TOKEN" >> "$GITHUB_ENV"
          echo "RAILWAY_API_TOKEN=" >> "$GITHUB_ENV"

      - name: Ensure persistent Prediction Lab volume
        shell: sh
        run: |
          set -eu
          # Railway CLI v4 parses project/service/environment as `volume`
          # parent options, before the list/add subcommand.
          VOLUMES="$(railway volume --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" list --json)"
          if printf '%s' "$VOLUMES" | grep -q '/data/prediction_lab'; then
            echo "Prediction Lab persistent volume already attached."
          else
            echo "Creating Prediction Lab persistent volume at /data/prediction_lab."
            railway volume --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" add --mount-path /data/prediction_lab --json
          fi

      - name: Deploy tested commit to main service
        shell: sh
        run: |
          set -eu
          railway up --project "$PROJECT_ID" --service "$MAIN_SERVICE_ID" --environment "$ENVIRONMENT_ID" --ci --message "Plane Alerts main ${DEPLOY_SHA}"
