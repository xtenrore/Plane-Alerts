name: v4.8.1 focused hotfix authoring

on:
  push:
    branches:
      - hotfix/v4.8.1-storage-database-truthiness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v481-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v4.8.1-storage-database-truthiness
          fetch-depth: 0

      - name: Apply verified Motor database truthiness fix
        run: |
          python - <<'PY'
          from pathlib import Path

          storage = Path('app/storage_runtime_v48.py')
          text = storage.read_text(encoding='utf-8')
          old = 'db = db or self._db()'
          new = 'db = self._db() if db is None else db'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected exactly 3 unsafe database truthiness expressions, found {count}')
          storage.write_text(text.replace(old, new), encoding='utf-8')

          version = Path('app/version.py')
          vtext = version.read_text(encoding='utf-8')
          if 'VERSION = "4.8.0"' not in vtext:
              raise SystemExit('unexpected canonical version before v4.8.1 patch')
          version.write_text(vtext.replace('VERSION = "4.8.0"', 'VERSION = "4.8.1"', 1), encoding='utf-8')

          readme = Path('README.md')
          rtext = readme.read_text(encoding='utf-8')
          marker = '**Current code version: Plane Alerts v4.8.0**'
          if marker not in rtext:
              raise SystemExit('README current-version marker not found')
          rtext = rtext.replace(marker, '**Current code version: Plane Alerts v4.8.1**', 1)
          storage_heading = '## Storage resilience\n'
          patch_note = ('## v4.8.1 production verification patch\n\n'
                        'Production verification exposed a Motor/PyMongo compatibility edge: database objects intentionally reject boolean truth testing. '
                        'v4.8.1 selects explicit database handles with `is None` checks, so a healthy Mongo connection no longer enters the degraded reconnect path for that reason. '
                        'Prediction behavior is unchanged.\n\n')
          if patch_note not in rtext:
              if storage_heading not in rtext:
                  raise SystemExit('README storage section marker not found')
              rtext = rtext.replace(storage_heading, patch_note + storage_heading, 1)
          readme.write_text(rtext, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Verify exact regression before committing
        run: |
          python -m compileall -q app
          pytest -q tests/test_storage_truthiness_v481.py tests/test_storage_v48.py tests/test_storage_guard_v48.py tests/test_storage_failure_v48.py tests/test_database_atlas.py

      - name: Remove temporary authoring workflow and commit patch
        run: |
          rm .github/workflows/v481-authoring.yml
          git config user.name "Plane Alerts Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: v4.8.1 avoid Mongo database truthiness [v481-applied]"
          git push origin HEAD:hotfix/v4.8.1-storage-database-truthiness
