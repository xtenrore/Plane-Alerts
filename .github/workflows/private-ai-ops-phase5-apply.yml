name: Apply Private Operations Phase 5 checkpoint

on:
  push:
    branches: [feature/private-ai-operations]
    paths:
      - '.github/workflows/private-ai-ops-phase5-apply.yml'

permissions:
  contents: write

concurrency:
  group: private-ai-ops-phase5-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-operations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and apply exact Phase 5 payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase5-payload/part*.b64 > /tmp/phase5.b64
          printf '%s  %s\n' '502b851c1f75cf3c6a00c92bf8ed8b7e4bee15ff319d7623ee05c9a991703062' /tmp/phase5.b64 | sha256sum -c -
          base64 -d /tmp/phase5.b64 | xz -dc | tar -xf - -C .
          python -m pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
          python -m compileall -q app/private_ops
          python -m pytest -q \
            tests/test_private_ops_store.py \
            tests/test_private_ops_dr_export.py \
            tests/test_private_ops_dr_sync.py \
            tests/test_private_ops_github_dr.py \
            tests/test_private_ops_phase2_probe.py \
            tests/test_private_ops_provider_router.py \
            tests/test_private_ops_provider_probe.py \
            tests/test_private_ops_collector.py \
            tests/test_private_ops_prediction_source.py \
            tests/test_private_ops_hourly_replay.py \
            tests/test_private_ops_phase5.py
      - name: Commit only the verified Phase 5 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase5-payload
          rm -f .github/workflows/private-ai-ops-phase5-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .phase5-payload \
            .github/workflows/private-ai-ops-phase5-apply.yml \
            .github/workflows/private-ai-ops-phase1.yml \
            app/private_ops/store.py \
            app/private_ops/provider_adapters.py \
            app/private_ops/provider_router.py \
            app/private_ops/phase5.py \
            app/private_ops/phase5_probe.py \
            app/private_ops/service.py \
            app/private_ops/dr_export.py \
            tests/test_private_ops_phase5.py \
            tests/test_private_ops_provider_router.py \
            tests/test_private_ops_dr_export.py \
            tests/test_private_ops_store.py \
            tests/test_private_ops_dr_sync.py
          git diff --cached --check
          git commit -m 'Implement Phase 5 AI triage and finding lifecycle'
          git push origin HEAD:feature/private-ai-operations
