name: Private Operations isolated validation
# Branch checkpoints target only the dedicated Private Operations Railway service.

on:
  push:
    branches: [feature/private-ai-operations]
    paths:
      - 'app/private_ops/**'
      - 'deploy/private-ai-ops/**'
      - 'tests/test_private_ops_store.py'
      - 'tests/test_private_ops_dr_export.py'
      - 'tests/test_private_ops_dr_sync.py'
      - 'tests/test_private_ops_github_dr.py'
      - 'tests/test_private_ops_phase2_probe.py'
      - 'tests/test_private_ops_provider_router.py'
      - 'tests/test_private_ops_provider_probe.py'
      - 'tests/test_private_ops_collector.py'
      - 'tests/test_private_ops_prediction_source.py'
      - 'tests/test_private_ops_hourly_replay.py'
      - 'tests/test_private_ops_phase5.py'
      - 'tests/test_private_ops_phase5_probe.py'
      - 'tests/test_private_ops_phase6.py'
      - 'tests/test_private_ops_phase6_dr_probe.py'
      - 'scripts/private_ai_ops_hourly_replay.py'
      - '.github/workflows/private-ai-ops-phase1.yml'

permissions:
  contents: read

concurrency:
  group: private-ai-ops-phase1
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      deploy: ${{ steps.head.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest>=8,<9' 'httpx>=0.27,<1'
      - run: python -m compileall -q app/private_ops
      - run: python -m pytest -q tests/test_private_ops_store.py tests/test_private_ops_dr_export.py tests/test_private_ops_dr_sync.py tests/test_private_ops_github_dr.py tests/test_private_ops_phase2_probe.py tests/test_private_ops_phase6_dr_probe.py tests/test_private_ops_provider_router.py tests/test_private_ops_provider_probe.py tests/test_private_ops_collector.py tests/test_private_ops_prediction_source.py tests/test_private_ops_hourly_replay.py tests/test_private_ops_phase5.py tests/test_private_ops_phase5_probe.py tests/test_private_ops_phase6.py
      - name: Refuse stale branch deployment
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/private-ai-operations" --jq '.object.sha')"
          if [[ "$CURRENT" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer branch commit exists; skipping stale deployment.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  provider-metadata-probes:
    needs: tests
    if: needs.tests.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
      GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
      GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
      GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      MISTRAL_API_2: ${{ secrets.MISTRAL_API_2 }}
      MISTRAL_API_3: ${{ secrets.MISTRAL_API_3 }}
      MISTRAL_API_4: ${{ secrets.MISTRAL_API_4 }}
      MISTRAL_API_5: ${{ secrets.MISTRAL_API_5 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx>=0.27,<1'
      - name: Check provider metadata only; never invoke inference
        run: python -m app.private_ops.provider_probe

  provision-and-deploy:
    needs: tests
    if: needs.tests.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      SERVICE_ID: d701080d-1a41-4054-a810-fd89742e1187
      WORKSPACE_ID: 3fcd544c-7798-4d82-b331-8ea8294ad9e5
      DEPLOY_SHA: ${{ github.sha }}
      AI_OPS_GITHUB_DR_TOKEN: ${{ secrets.AI_OPS_GITHUB_DR_TOKEN }}
      AI_OPS_PHASE2_FAULT_PROBE_ENABLED: 'false'
      AI_OPS_PHASE5_SHADOW_PROBE_ENABLED: 'true'
      AI_OPS_PHASE6_DR_PROBE_ENABLED: 'true'
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Authenticate using the existing GitHub Actions secret
        shell: sh
        run: |
          set -eu
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            exit 0
          fi
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions Railway authentication secret.' >&2
            exit 1
          fi
          if railway link --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --workspace "$WORKSPACE_ID"; then
            exit 0
          fi
          echo 'RAILWAY_TOKEN='"$RAILWAY_API_TOKEN" >> "$GITHUB_ENV"
          echo 'RAILWAY_API_TOKEN=' >> "$GITHUB_ENV"
      - name: Provision only the dedicated AI Ops volume
        shell: sh
        run: |
          set -eu
          VOLUMES="$(railway volume --project "$PROJECT_ID" --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" list --json)"
          if printf '%s' "$VOLUMES" | grep -q '/data/ai_ops'; then
            echo 'Dedicated AI Ops volume already attached.'
          else
            railway volume --project "$PROJECT_ID" --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" add --mount-path /data/ai_ops --json >/dev/null
            echo 'Dedicated AI Ops volume attached.'
          fi
      - name: Project GitHub-controlled DR configuration into the isolated service
        shell: sh
        run: |
          set -eu
          railway variable set "AI_OPS_SOURCE_COMMIT=$DEPLOY_SHA" \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
          railway variable set "AI_OPS_PHASE2_FAULT_PROBE_ENABLED=$AI_OPS_PHASE2_FAULT_PROBE_ENABLED" \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
          railway variable set "AI_OPS_PHASE5_SHADOW_PROBE_ENABLED=$AI_OPS_PHASE5_SHADOW_PROBE_ENABLED" \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
          railway variable set "AI_OPS_PHASE6_DR_PROBE_ENABLED=$AI_OPS_PHASE6_DR_PROBE_ENABLED" \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
          if [ -n "${AI_OPS_GITHUB_DR_TOKEN:-}" ]; then
            printf '%s' "$AI_OPS_GITHUB_DR_TOKEN" | railway variable set AI_OPS_GITHUB_DR_TOKEN --stdin \
              --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
            railway variable set AI_OPS_GITHUB_DR_ENABLED=true \
              --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
          else
            railway variable set AI_OPS_GITHUB_DR_ENABLED=false \
              --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null
            railway variable delete AI_OPS_GITHUB_DR_TOKEN \
              --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" >/dev/null 2>&1 || true
          fi
      - name: Deploy only the isolated AI Ops service
        shell: sh
        run: |
          set -eu
          railway up --project "$PROJECT_ID" --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --ci --message "Private Ops Phase 6 ${DEPLOY_SHA}"
      - name: Disable the one-shot Phase 5 shadow probe flag
        if: always()
        shell: sh
        run: |
          set +e
          railway variable set AI_OPS_PHASE5_SHADOW_PROBE_ENABLED=false \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null 2>&1
          railway variable set AI_OPS_PHASE6_DR_PROBE_ENABLED=false \
            --service "$SERVICE_ID" --environment "$ENVIRONMENT_ID" --skip-deploys >/dev/null 2>&1
          exit 0
