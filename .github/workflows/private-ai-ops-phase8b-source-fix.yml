name: Apply bounded Phase 8B Supervisor source fix

on:
  push:
    branches: [feature/private-ai-operations]
    paths: ['.github/workflows/private-ai-ops-phase8b-source-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-operations
          fetch-depth: 0
      - name: Apply exact failover-history fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/private_ops/supervisor.py')
          text = path.read_text()
          old = '''    def set_affinity(self, conversation_id: str, provider: str, model: str, slot: str, *, reason: str) -> None:\n        now = time.time()\n        with self._connect() as db:\n            old = db.execute(\n                "SELECT provider,model,slot FROM supervisor_conversations WHERE conversation_id=?",\n                (conversation_id,),\n            ).fetchone()\n            if not old:\n                raise KeyError("unknown conversation")\n            changed = (old["provider"], old["model"], old["slot"]) != (provider, model, slot)\n            if changed and old["provider"]:\n                db.execute("""INSERT INTO supervisor_switches(\n                    conversation_id,from_provider,from_model,from_slot,to_provider,to_model,to_slot,reason,created)\n                    VALUES(?,?,?,?,?,?,?,?,?)""",\n                    (conversation_id, old["provider"], old["model"], old["slot"], provider, model, slot, reason[:80], now),\n                )\n            db.execute(\n                "UPDATE supervisor_conversations SET provider=?,model=?,slot=?,status='ACTIVE',updated=? WHERE conversation_id=?",\n                (provider, model, slot, now, conversation_id),\n            )\n'''
          new = '''    def set_affinity(self, conversation_id: str, provider: str, model: str, slot: str, *, reason: str,\n                     from_route: tuple[str, str, str] | None = None) -> None:\n        now = time.time()\n        with self._connect() as db:\n            old = db.execute(\n                "SELECT provider,model,slot FROM supervisor_conversations WHERE conversation_id=?",\n                (conversation_id,),\n            ).fetchone()\n            if not old:\n                raise KeyError("unknown conversation")\n            old_route = (old["provider"], old["model"], old["slot"])\n            target = (provider, model, slot)\n            source = from_route if from_route and from_route[0] else old_route\n            if source[0] and source != target:\n                db.execute("""INSERT INTO supervisor_switches(\n                    conversation_id,from_provider,from_model,from_slot,to_provider,to_model,to_slot,reason,created)\n                    VALUES(?,?,?,?,?,?,?,?,?)""",\n                    (conversation_id, source[0], source[1], source[2], provider, model, slot, reason[:80], now),\n                )\n            db.execute(\n                "UPDATE supervisor_conversations SET provider=?,model=?,slot=?,status='ACTIVE',updated=? WHERE conversation_id=?",\n                (provider, model, slot, now, conversation_id),\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('set_affinity source did not match exactly once')
          text = text.replace(old, new)
          old = '''        last_failure = "unavailable"\n        previous_route = (conversation.get("provider"), conversation.get("model"), conversation.get("slot"))\n\n        for slot, model in self._candidate_routes(conversation, explicit_switch=explicit_switch):\n'''
          new = '''        last_failure = "unavailable"\n        previous_route = (conversation.get("provider"), conversation.get("model"), conversation.get("slot"))\n        failed_route: tuple[str, str, str] | None = None\n\n        for slot, model in self._candidate_routes(conversation, explicit_switch=explicit_switch):\n'''
          if text.count(old) != 1:
              raise SystemExit('chat route prelude did not match exactly once')
          text = text.replace(old, new)
          old = '''                reason = "explicit_user_request" if explicit_switch else "provider_failover" if previous_route[0] else "initial_selection"\n                self.state.set_affinity(conversation_id, slot.provider, model, slot.name, reason=reason)\n'''
          new = '''                reason = ("explicit_user_request" if explicit_switch else\n                          "provider_failover" if (previous_route[0] or failed_route) else "initial_selection")\n                self.state.set_affinity(\n                    conversation_id, slot.provider, model, slot.name, reason=reason,\n                    from_route=failed_route if not previous_route[0] else None,\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('success affinity block did not match exactly once')
          text = text.replace(old, new)
          old = '''                self.state.record_usage(conversation_id, slot.provider, model, label, 0, 0, 0,\n                                        success=False, latency_ms=elapsed, failure_kind=exc.kind)\n                continue\n'''
          new = '''                self.state.record_usage(conversation_id, slot.provider, model, label, 0, 0, 0,\n                                        success=False, latency_ms=elapsed, failure_kind=exc.kind)\n                failed_route = (slot.provider, model, slot.name)\n                continue\n'''
          if text.count(old) != 1:
              raise SystemExit('failure block did not match exactly once')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          python -m py_compile app/private_ops/supervisor.py
          git diff --check
          git rm .github/workflows/private-ai-ops-phase8b-source-fix.yml
          git config user.name 'Plane Alerts Phase 8B'
          git config user.email 'actions@users.noreply.github.com'
          git add app/private_ops/supervisor.py
          git commit -m 'Fix Phase 8B Supervisor failover history'
          git push origin HEAD:feature/private-ai-operations
