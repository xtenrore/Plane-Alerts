name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked dependencies
        run: pip install -r requirements.lock

      - name: Compile application and Vercel runtime
        run: python -m compileall -q app api

      - name: Build pinned global airport database
        run: python scripts/build_airport_data_v471.py

      - name: Verify global airport database coverage and overrides
        run: python scripts/verify_airport_data_v471.py

      - name: Run full test suite
        run: pytest -q

      - name: Run Error Museum and lifecycle replay suite
        run: pytest -q tests/test_prediction_replay.py tests/test_prediction_lab.py tests/test_v42_prediction_replay.py tests/test_v42_lifecycle_replay.py

      - name: Run provider regression suite
        run: pytest -q tests/test_provider_manager_v45.py tests/test_v45_provider_regressions.py

      - name: Run Telegram interaction latency regression suite
        run: pytest -q tests/test_interaction_v46.py

      - name: Run v4.7 airport, runway and Error Museum suite
        run: pytest -q tests/test_airport_intelligence_v47.py tests/test_v47_airport_regressions.py

      - name: Run v4.7.1 global airport data suite
        run: pytest -q tests/test_global_airports_v471.py

      - name: Run v4.7.2 LTBA/ISL terminal-arrival hold suite
        run: pytest -q tests/test_terminal_arrival_hold_v472.py

      - name: Run v4.7.3 arrival delivery and landing-path regressions
        run: pytest -q tests/test_v473_arrival_delivery_guard.py tests/test_v473_landing_path_regressions.py

      - name: Run v4.8 storage outage, restart, migration, backup, lifecycle-ID and Telegram failure suite
        run: pytest -q tests/test_storage_v48.py tests/test_storage_regressions_v48.py tests/test_storage_migrations_v48.py tests/test_storage_backup_v48.py tests/test_lifecycle_ids_v48.py tests/test_telegram_failure_v48.py

      - name: Run v4.9 self-hosting, doctor and release-publish suite
        run: pytest -q tests/test_self_hosting_v49.py tests/test_doctor_v49.py tests/test_release_publish_v49.py

      - name: Run v5.0 observability suite
        run: pytest -q tests/test_observability_v50.py

      - name: Run v5.1 3D proximity and observed-pass lifecycle suite
        run: pytest -q tests/test_proximity_3d_v51.py tests/test_v51_prediction_replay.py tests/test_v51_lifecycle_replay.py

      - name: Run v5.2 shadow evaluation and promotion-safety suite
        run: pytest -q tests/test_shadow_eval_v52.py tests/test_v52_prediction_replay.py tests/test_v52_promotion_safety.py

      - name: Replay v5.2 shadow evaluation fixtures
        run: python scripts/replay_shadow_eval_v52.py

      - name: Run v5.3 multi-user scale and production-chain regression suite
        run: pytest -q tests/test_multi_location_v53.py tests/test_prediction_regressions_v53.py tests/test_v53_production_chain.py

      - name: Run v5.4 presets, navigation, recovery and Mini App UX suite
        run: pytest -q tests/test_user_experience_v54.py

      - name: Run v5.5 file-backed Prediction Lab, migration, pipeline and cadence suite
        run: pytest -q tests/test_prediction_lab_files_v55.py tests/test_prediction_lab_pipeline_v55.py tests/test_prediction_lab_runtime_v55.py tests/test_startup_storage_maintenance_v553.py

      - name: Benchmark v4.2 terminal-arrival ensemble
        run: python scripts/benchmark_v42_terminal_arrival.py

      - name: Benchmark v4.5 provider critical path
        run: python scripts/benchmark_provider_v45.py

      - name: Benchmark v4.6 prediction intelligence
        run: python scripts/benchmark_prediction_v46.py

      - name: Benchmark v4.6 Telegram callback latency
        run: python scripts/benchmark_interaction_v46.py

      - name: Benchmark v4.7 terminal intelligence
        run: python scripts/benchmark_airport_v47.py

      - name: Benchmark v4.7.1 global airport lookup
        run: python scripts/benchmark_airport_v471.py

      - name: Benchmark v4.7.2 terminal-arrival initial hold
        run: python scripts/benchmark_v472_terminal_hold.py

      - name: Benchmark v4.8 slow/unavailable storage isolation
        run: python scripts/benchmark_storage_v48.py

      - name: Benchmark v4.9 doctor static diagnostics
        run: python scripts/benchmark_v49_doctor.py

      - name: Benchmark v5.0 diagnostics formatting overhead
        run: python scripts/benchmark_v50_observability.py

      - name: Benchmark v5.1 deterministic 3D geometry
        run: python scripts/benchmark_v51_geometry.py

      - name: Benchmark v5.2 shadow evaluation overhead
        run: python scripts/benchmark_v52_shadow_eval.py

      - name: Benchmark v5.3 multi-location scale path
        run: python scripts/benchmark_v53_scale.py

      - name: Benchmark v5.4 preset/profile UX path
        run: python scripts/benchmark_v54_profile_ux.py

      - name: Benchmark v5.5 Prediction Lab atomic persistence
        run: python scripts/benchmark_v55_prediction_lab.py

      - name: Verify dependency consistency
        run: pip check

  self-hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose config | grep -q '/data/prediction_lab'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build fresh amd64 image
        run: docker buildx build --platform linux/amd64 --build-arg TARGETARCH=amd64 --load -t plane-alerts:v55 .

      - name: Run doctor in fresh image
        run: |
          docker run --rm --entrypoint planealerts \
            -e TELEGRAM_BOT_TOKEN=123456:test-token \
            -e MONGO_URI=mongodb://mongo:27017 \
            plane-alerts:v55 doctor --offline

      - name: Verify v5 operator CLI is installed in fresh image
        run: |
          docker run --rm --entrypoint planealerts plane-alerts:v55 diagnostics --help
          docker run --rm --entrypoint planealerts plane-alerts:v55 shadow-eval --help

      - name: Verify v5.5.3 runtime wiring in fresh image
        run: docker run --rm plane-alerts:v55 python -c "from app.prediction_lab_files_v55 import DEFAULT_ROOT, LAB_COLLECTIONS; from app.version import VERSION; assert VERSION == '5.5.3'; assert DEFAULT_ROOT == '/data/prediction_lab'; assert len(LAB_COLLECTIONS) == 3"

      - name: Build ARM64 image
        run: docker buildx build --platform linux/arm64 --build-arg TARGETARCH=arm64 --output=type=cacheonly .