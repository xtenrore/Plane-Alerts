name: tests

on:
  push:
    branches:
      - main
      - "chatgpt/**"
      - "fix/**"
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Compile application and Vercel runtime
        run: python -m compileall -q app vercel_runtime worker.py

      - name: Build pinned global airport database
        run: python scripts/build_airport_database.py

      - name: Verify global airport database coverage and overrides
        run: python scripts/verify_airport_database.py

      - name: Run full test suite
        env:
          TELEGRAM_BOT_TOKEN: ""
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""
          OPENSKY_CREDENTIALS_JSON: ""
          LOCAL_ADSB_URL: ""
        run: pytest -q

      - name: Run Error Museum and lifecycle replay suite
        run: pytest -q tests/test_error_museum_v42.py tests/test_v44_monitor_reliability_replay.py tests/test_eta_stability_hotfix.py

      - name: Run provider regression suite
        run: pytest -q tests/test_v45_provider_resilience.py tests/test_v45_local_provider_area_recovery.py

      - name: Run Telegram interaction latency regression suite
        run: pytest -q tests/test_interaction_v46.py

      - name: Run v4.7 airport, runway and Error Museum suite
        run: pytest -q tests/test_airport_terminal_v47.py tests/test_runway_data_v47.py tests/test_route_guard_v47.py tests/test_error_museum_v47.py

      - name: Run v4.7.1 global airport data suite
        run: pytest -q tests/test_global_airport_data_v471.py

      - name: Run v4.7.2 LTBA/ISL terminal-arrival hold suite
        run: pytest -q tests/test_terminal_arrival_hold_v472.py

      - name: Benchmark v4.2 terminal-arrival ensemble
        run: python scripts/benchmark_v42.py

      - name: Benchmark v4.5 provider critical path
        run: python scripts/benchmark_v45_provider_resilience.py

      - name: Benchmark v4.6 prediction intelligence
        run: python scripts/benchmark_v46_prediction.py

      - name: Benchmark v4.6 Telegram callback latency
        run: python scripts/benchmark_v46_interaction.py

      - name: Benchmark v4.7 terminal intelligence
        run: python scripts/benchmark_v47_terminal.py

      - name: Benchmark v4.7.1 global airport lookup
        run: python scripts/benchmark_v471_airport_lookup.py

      - name: Benchmark v4.7.2 terminal-arrival initial hold
        run: python scripts/benchmark_v472_terminal_hold.py

      - name: Verify dependency consistency
        run: pip check
