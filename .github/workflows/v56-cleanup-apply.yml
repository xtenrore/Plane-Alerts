name: v56-cleanup-apply

on:
  push:
    branches:
      - fix/v5.6-retired-integration-cleanup
    paths:
      - .github/workflows/v56-cleanup-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v5.6-retired-integration-cleanup
          fetch-depth: 0
      - name: Remove retired integration residue and prepare v5.6
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          upper = "A" + "GY"
          lower = "a" + "gy"
          old_brand_a = "Anti" + "gravity"
          old_brand_b = "anti" + "gravity"
          old_handoff = "CHATGPT_" + "HANDOFF_JSON"
          skip = {'.git', '__pycache__', '.pytest_cache', '.venv', 'venv', 'node_modules'}

          for path in root.rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              text = text.replace(old_brand_a, 'retired external agent')
              text = text.replace(old_brand_b, 'retired external agent')
              text = text.replace(old_handoff, 'retired handoff event')
              text = text.replace(upper, 'retired external agent')
              text = text.replace(lower, 'retired_agent')
              if text != original:
                  path.write_text(text, encoding='utf-8')

          version = Path('app/version.py')
          text = version.read_text(encoding='utf-8')
          text = text.replace('VERSION = "5.5.4"', 'VERSION = "5.6"', 1)
          marker = '# v5.5.4 replaces stacked route-history/runway arrival vetoes with one cached,\n# provider-first destination/path qualification guard. The underlying motion/3D\n# predictor is unchanged; only destination-aware alert qualification changes.\n'
          addition = marker + '# v5.6 removes all remaining retired external-agent names/hand-off residue from\n# active source, tests and documentation. Prediction behavior is unchanged.\n'
          if marker in text and '# v5.6 removes all remaining' not in text:
              text = text.replace(marker, addition, 1)
          version.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('**Current code version: Plane Alerts v5.5.4**', '**Current code version: Plane Alerts v5.6**', 1)
          heading = '## v5.5.4 — Provider-First Destination Path Guard\n'
          section = (
              '## v5.6 — Retired Integration Cleanup\n\n'
              'v5.6 removes the remaining names, hand-off labels and stale documentation references from the retired external-agent integration. '
              'The Railway runtime already operated without that sidecar; this release also removes the final stale production token and adds a repository-wide regression so those references cannot return.\n\n'
              'There is no trajectory, CPA, ETA, destination-path, qualification, cancellation, provider, database or alert-timing change. '
              'The physical prediction version remains `5.3-3d-proximity-age-aware`, and the v5.5.4 destination-path arrival fix is preserved unchanged.\n\n'
          )
          if heading in text and '## v5.6 — Retired Integration Cleanup' not in text:
              text = text.replace(heading, section + heading, 1)
          readme.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = 'Plane Alerts uses separate production releases. Detailed notes live under `docs/releases/`.\n\n'
          entry = (
              '## v5.6 — Retired Integration Cleanup\n\n'
              '- Removed remaining retired external-agent names and hand-off labels from active source comments, tests and historical documentation.\n'
              '- Removed the final stale retired-agent production token from Railway and added a repository-wide regression preventing those names from returning.\n'
              '- No live prediction, destination-path, provider, storage, Telegram or alert-timing behavior changed; prediction version remains `5.3-3d-proximity-age-aware`.\n\n'
          )
          if anchor in text and '## v5.6 — Retired Integration Cleanup' not in text:
              text = text.replace(anchor, anchor + entry, 1)
          changelog.write_text(text, encoding='utf-8')

          Path('docs/releases/v5.6.md').write_text(
              '# Plane Alerts v5.6 — Retired Integration Cleanup\n\n'
              '## Summary\n\n'
              'v5.6 is a Railway-only cleanup release following the v5.5.4 destination-path production fix. It removes the remaining names and hand-off labels belonging to the retired external-agent integration from application comments, tests and historical project documentation, and removes the final stale production token from Railway.\n\n'
              'A repository-wide regression now rejects any reintroduction of those retired identifiers. The v5.5.4 destination-path arrival guard remains unchanged.\n\n'
              '## Runtime behavior\n\n'
              '- No trajectory or CPA change.\n'
              '- No ETA or confidence change.\n'
              '- No destination/path qualification or cancellation change.\n'
              '- No provider, database schema, dependency or start-command change.\n'
              '- No Telegram alert-timing change.\n'
              '- Prediction version remains `5.3-3d-proximity-age-aware`.\n\n'
              '## Validation\n\n'
              'The normal Railway production gate must pass on the exact v5.6 candidate and again on the exact merged main commit. The long community/self-host platform matrix is not part of this Railway-only release.\n\n'
              '## Rollback\n\n'
              'If production verification fails, roll Railway back to the previously healthy v5.5.4 main commit `56fd16087f0ce515a51d19485063de4c5f876d5e`.\n',
              encoding='utf-8',
          )
          PY

          git rm -f .github/workflows/v56-residue-audit.yml .github/workflows/v56-cleanup-apply.yml
          git config user.name "Plane Alerts Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Plane Alerts v5.6 — remove retired integration residue"
          git push origin HEAD:fix/v5.6-retired-integration-cleanup
