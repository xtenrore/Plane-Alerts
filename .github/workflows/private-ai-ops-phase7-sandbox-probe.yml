name: Private AI Ops Phase 7 sandbox compatibility probe

on:
  push:
    branches: [feature/private-ai-operations, investigate/phase7-sandbox]
    paths:
      - '.github/workflows/private-ai-ops-phase7-sandbox-probe.yml'
      - 'app/private_ops/**'
      - 'deploy/private-ai-ops/sandbox.Dockerfile'
      - 'scripts/private_ai_ops_phase7_*.py'
      - 'tests/test_private_ops*.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify disposable credential-free container isolation
        run: |
          set -eu
          docker run --rm --pull always --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 \
            --memory 768m --cpus 1 --user 65534:65534 \
            --mount type=bind,src="$GITHUB_WORKSPACE",dst=/work,readonly \
            -w /work python:3.11-slim \
            python -c 'import pathlib,socket; assert pathlib.Path("app/private_ops/store.py").is_file(); assert not pathlib.Path("/data/ai_ops").exists(); assert not pathlib.Path("/run/secrets").exists();
          try:
            socket.create_connection(("example.com", 443), timeout=2)
          except OSError:
            pass
          else:
            raise AssertionError("network reachable from sandbox")
          try:
            pathlib.Path("/work/sandbox-escape").write_text("no")
          except OSError:
            pass
          else:
            raise AssertionError("read-only source mount writable")'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install locked host test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile Phase 7 implementation
        run: python -m py_compile app/private_ops/*.py scripts/private_ai_ops_phase7_*.py tests/test_private_ops*.py
      - name: Run full Private AI Ops suite
        env:
          TELEGRAM_BOT_TOKEN: ''
          GEMINI_API_KEY: ''
          GROQ_API_KEY: ''
        run: pytest -q tests/test_private_ops*.py
      - name: Compile full repository runtime
        run: python -m compileall -q app vercel_runtime worker.py
      - name: Build pinned global airport database
        run: python scripts/build_airport_database.py
      - name: Verify global airport database coverage and overrides
        run: python scripts/verify_airport_database.py
      - name: Run full repository test suite
        env:
          TELEGRAM_BOT_TOKEN: ''
          GEMINI_API_KEY: ''
          GROQ_API_KEY: ''
          OPENSKY_CREDENTIALS_JSON: ''
          LOCAL_ADSB_URL: ''
        run: pytest -q
      - name: Verify dependency integrity
        run: pip check
      - name: Build approved locked sandbox image before execution
        run: docker build -f deploy/private-ai-ops/sandbox.Dockerfile -t "plane-alerts-investigator:$GITHUB_SHA" .
      - name: Run real pinned Error Museum and candidate canary
        env:
          AI_OPS_SANDBOX_BACKEND: docker
          AI_OPS_SANDBOX_IMAGE: plane-alerts-investigator:${{ github.sha }}
          PYTHONPATH: .
        run: python scripts/private_ai_ops_phase7_sandbox_canary.py
