name: Apply portable Phase 8B exact-head check fix

on:
  push:
    branches: [feature/private-ai-operations]
    paths: ['.github/workflows/private-ai-ops-phase8b-headcheck-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-operations
          fetch-depth: 0
      - name: Replace Python-only parser with portable shell parser
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/private-ai-ops-phase8b.yml')
          text = path.read_text()
          old = '''          CURRENT="$(wget -qO- "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/private-ai-operations" | python -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])')"\n          test "$CURRENT" = "$DEPLOY_SHA"\n'''
          new = '''          REF_JSON="$(wget -qO- "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/feature/private-ai-operations")"\n          CURRENT="$(printf '%s' "$REF_JSON" | grep -oE '\"sha\"[[:space:]]*:[[:space:]]*\"[0-9a-f]{40}\"' | head -1 | grep -oE '[0-9a-f]{40}')"\n          test -n "$CURRENT"\n          test "$CURRENT" = "$DEPLOY_SHA"\n'''
          if text.count(old) != 1:
              raise SystemExit('exact-head parser anchor did not match exactly once')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git rm .github/workflows/private-ai-ops-phase8b-headcheck-fix.yml
          git config user.name 'Plane Alerts Phase 8B'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/private-ai-ops-phase8b.yml
          git commit -m 'Make Phase 8B exact-head gate portable'
          git push origin HEAD:feature/private-ai-operations
