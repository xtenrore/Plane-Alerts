name: Apply bounded Phase 8B reasoning-output fix

on:
  push:
    branches: [feature/private-ai-operations]
    paths: ['.github/workflows/private-ai-ops-phase8b-reasoning-fix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-operations
          fetch-depth: 0
      - name: Apply exact documented reasoning controls and regression test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/private_ops/supervisor.py')
          text = path.read_text()
          anchor = '''def cloudflare_slot_label(slot: Slot) -> str:\n    if slot.provider != "cloudflare":\n        return slot.name\n    return "Slot 2" if slot.name.endswith("_2") else "Slot 1"\n\n\n'''
          addition = '''def cloudflare_slot_label(slot: Slot) -> str:\n    if slot.provider != "cloudflare":\n        return slot.name\n    return "Slot 2" if slot.name.endswith("_2") else "Slot 1"\n\n\ndef cloudflare_reasoning_controls(model: str) -> dict[str, object]:\n    """Force bounded user-visible output for approved reasoning-capable Workers AI chat models.\n\n    These settings are sent directly in the Workers AI REST request. They prevent the\n    small Supervisor output budget from being consumed entirely by hidden reasoning.\n    Nemotron additionally documents force_nonempty_content for agent/coding use.\n    """\n    if model == "@cf/nvidia/nemotron-3-120b-a12b":\n        return {"enable_thinking": False, "force_nonempty_content": True}\n    if model in {"@cf/google/gemma-4-26b-a4b-it", "@cf/zai-org/glm-4.7-flash"}:\n        return {"enable_thinking": False}\n    return {}\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('slot-label anchor did not match exactly once')
          text = text.replace(anchor, addition)

          old = '''            payload = {"model": model, "messages": list(messages), "max_tokens": 700,\n                       "temperature": 0, "options": {"rejectIfBusy": True}}\n            if tools:\n'''
          new = '''            payload = {"model": model, "messages": list(messages), "max_completion_tokens": 700,\n                       "temperature": 0, "options": {"rejectIfBusy": True},\n                       "chat_template_kwargs": cloudflare_reasoning_controls(model)}\n            if tools:\n'''
          if text.count(old) != 1:
              raise SystemExit('Cloudflare payload anchor did not match exactly once')
          text = text.replace(old, new)
          path.write_text(text)

          test = Path('tests/test_private_ops_supervisor.py')
          body = test.read_text()
          old_import = '''    ChatResult, SupervisorBackend, SupervisorEngine, SupervisorStore,\n    CLOUDFLARE_DAILY_NEURON_BUDGET,\n)'''
          new_import = '''    ChatResult, SupervisorBackend, SupervisorEngine, SupervisorStore,\n    CLOUDFLARE_DAILY_NEURON_BUDGET, cloudflare_reasoning_controls,\n)'''
          if body.count(old_import) != 1:
              raise SystemExit('Supervisor test import anchor did not match exactly once')
          body = body.replace(old_import, new_import)
          marker = 'def test_cloudflare_reasoning_controls_keep_bounded_chat_user_visible():'
          if marker not in body:
              body += '''\n\n\ndef test_cloudflare_reasoning_controls_keep_bounded_chat_user_visible():\n    assert cloudflare_reasoning_controls("@cf/nvidia/nemotron-3-120b-a12b") == {\n        "enable_thinking": False, "force_nonempty_content": True,\n    }\n    assert cloudflare_reasoning_controls("@cf/google/gemma-4-26b-a4b-it") == {"enable_thinking": False}\n    assert cloudflare_reasoning_controls("@cf/zai-org/glm-4.7-flash") == {"enable_thinking": False}\n    assert cloudflare_reasoning_controls("not-approved") == {}\n'''
          test.write_text(body)
          PY
          python -m py_compile app/private_ops/supervisor.py tests/test_private_ops_supervisor.py
          git diff --check
          git rm .github/workflows/private-ai-ops-phase8b-reasoning-fix.yml
          git config user.name 'Plane Alerts Phase 8B'
          git config user.email 'actions@users.noreply.github.com'
          git add app/private_ops/supervisor.py tests/test_private_ops_supervisor.py
          git commit -m 'Bound Phase 8B Supervisor reasoning output'
          git push origin HEAD:feature/private-ai-operations
