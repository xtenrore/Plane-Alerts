name: Provision FreeLLMAPI storage

on:
  push:
    branches:
      - feature/maintenance-router-integration
    paths:
      - .github/workflows/provision-freellmapi-storage.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      RAILWAY_ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      RAILWAY_SERVICE_ID: 933e7a93-bfe7-4bd3-972a-a2b69083f117
      MOUNT_PATH: /app/server/data
    steps:
      - name: Create dedicated persistent volume
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::RAILWAY_API_TOKEN is unavailable"
            exit 1
          fi
          python - <<'PY'
          import json, os
          payload = {
              "query": "mutation CreateVolume($input: VolumeCreateInput!) { volumeCreate(input: $input) { id name } }",
              "variables": {
                  "input": {
                      "projectId": os.environ["RAILWAY_PROJECT_ID"],
                      "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
                      "serviceId": os.environ["RAILWAY_SERVICE_ID"],
                      "mountPath": os.environ["MOUNT_PATH"],
                  }
              },
          }
          with open('/tmp/railway-volume-request.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle)
          PY
          HTTP_CODE="$(curl --silent --show-error \
            --output /tmp/railway-volume-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'User-Agent: railway-cli/maintenance-provisioner' \
            --header "Project-Access-Token: ${RAILWAY_TOKEN}" \
            --data-binary @/tmp/railway-volume-request.json \
            https://backboard.railway.com/graphql/v2)"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Railway GraphQL returned HTTP ${HTTP_CODE}"
            head -c 500 /tmp/railway-volume-response.json || true
            exit 1
          fi
          python - <<'PY'
          import json, os
          result=json.load(open('/tmp/railway-volume-response.json', encoding='utf-8'))
          if result.get('errors'):
              raise SystemExit('Railway GraphQL error: ' + json.dumps(result['errors'])[:1000])
          volume=((result.get('data') or {}).get('volumeCreate') or {})
          volume_id=str(volume.get('id') or '')
          if not volume_id:
              raise SystemExit('Railway did not return the new volume id')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as handle:
              handle.write(f"Created dedicated FreeLLMAPI volume `{volume_id}` at `{os.environ['MOUNT_PATH']}`.\n")
          PY
          rm -f /tmp/railway-volume-request.json /tmp/railway-volume-response.json
