name: Provision FreeLLMAPI storage

on:
  push:
    branches:
      - feature/maintenance-router-integration
    paths:
      - .github/workflows/provision-freellmapi-storage.yml

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      RAILWAY_PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      RAILWAY_ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      RAILWAY_SERVICE_ID: 933e7a93-bfe7-4bd3-972a-a2b69083f117
      MOUNT_PATH: /app/server/data
    steps:
      - name: Create dedicated persistent volume
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::RAILWAY_API_TOKEN is unavailable"
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          query = '''
          mutation CreateVolume($input: VolumeCreateInput!) {
            volumeCreate(input: $input) { id name }
          }
          '''
          payload = {
              "query": query,
              "variables": {
                  "input": {
                      "projectId": os.environ["RAILWAY_PROJECT_ID"],
                      "environmentId": os.environ["RAILWAY_ENVIRONMENT_ID"],
                      "serviceId": os.environ["RAILWAY_SERVICE_ID"],
                      "mountPath": os.environ["MOUNT_PATH"],
                  }
              },
          }
          request = urllib.request.Request(
              "https://backboard.railway.com/graphql/v2",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "Project-Access-Token": os.environ["RAILWAY_TOKEN"],
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Railway GraphQL HTTP {exc.code}: {body[:500]}") from exc
          if result.get("errors"):
              raise SystemExit("Railway GraphQL error: " + json.dumps(result["errors"])[:1000])
          volume = ((result.get("data") or {}).get("volumeCreate") or {})
          volume_id = str(volume.get("id") or "")
          if not volume_id:
              raise SystemExit("Railway did not return the new volume id")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"volume_id={volume_id}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(f"Created dedicated FreeLLMAPI volume `{volume_id}` at `{os.environ['MOUNT_PATH']}`.\n")
          PY
