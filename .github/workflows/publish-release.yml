name: Publish tagged Plane Alerts release

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: plane-alerts-release-publish
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm tested commit is still main head
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          if [[ "${CURRENT_MAIN_SHA}" != "${TESTED_SHA}" ]]; then
            echo "A newer main commit exists; its own successful test run will publish the release."
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "publish=true" >> "${GITHUB_OUTPUT}"

      - name: Resolve canonical version and notes
        if: steps.head.outputs.publish == 'true'
        id: release_meta
        run: |
          set -euo pipefail
          VERSION="$(python -c 'from app.version import VERSION; print(VERSION)')"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Canonical VERSION is not a release semantic version: ${VERSION}" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"
          if [[ ! -s "${NOTES}" ]]; then
            echo "Missing non-empty release notes: ${NOTES}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "notes=${NOTES}" >> "${GITHUB_OUTPUT}"

      - name: Validate guided installer assets
        if: steps.head.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python scripts/community_installer_v55.py --self-test
          bash -n setup-linux.sh
          bash -n setup-linux-arm64.sh
          bash -n setup-raspberry-pi.sh
          for asset in setup.bat setup-windows.bat setup-windows-arm64.bat setup-linux.sh setup-linux-arm64.sh setup-raspberry-pi.sh; do
            [[ -s "$asset" ]] || { echo "Missing installer asset: $asset" >&2; exit 1; }
          done
          rm -rf release-assets
          mkdir release-assets
          cp setup.bat setup-windows.bat setup-windows-arm64.bat setup-linux.sh setup-linux-arm64.sh setup-raspberry-pi.sh release-assets/
          chmod +x release-assets/*.sh
          (
            cd release-assets
            sha256sum setup.bat setup-windows.bat setup-windows-arm64.bat setup-linux.sh setup-linux-arm64.sh setup-raspberry-pi.sh > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Validate existing tag and release state
        if: steps.head.outputs.publish == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null; then
            TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [[ "${TAG_SHA}" != "${TESTED_SHA}" ]]; then
              echo "Refusing to move existing ${TAG}: ${TAG_SHA} != tested ${TESTED_SHA}" >&2
              exit 1
            fi
            echo "tag_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "tag_exists=false" >> "${GITHUB_OUTPUT}"
          fi

          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release_exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "release_exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish immutable GitHub release
        if: >-
          steps.head.outputs.publish == 'true' &&
          steps.existing.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          NOTES: ${{ steps.release_meta.outputs.notes }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG_EXISTS: ${{ steps.existing.outputs.tag_exists }}
        run: |
          set -euo pipefail
          assets=(
            release-assets/setup.bat
            release-assets/setup-windows.bat
            release-assets/setup-windows-arm64.bat
            release-assets/setup-linux.sh
            release-assets/setup-linux-arm64.sh
            release-assets/setup-raspberry-pi.sh
            release-assets/SHA256SUMS.txt
          )
          if [[ "${TAG_EXISTS}" == "true" ]]; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "Plane Alerts v${VERSION}" \
              --notes-file "${NOTES}" \
              "${assets[@]}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TESTED_SHA}" \
              --title "Plane Alerts v${VERSION}" \
              --notes-file "${NOTES}" \
              "${assets[@]}"
          fi

      - name: Verify published tag and installer assets
        if: steps.head.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          TAG_SHA="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "${TAG_SHA}" != "${TESTED_SHA}" ]]; then
            echo "Published tag does not point to the tested commit." >&2
            exit 1
          fi
          release="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName,isDraft,isPrerelease,targetCommitish,assets,url)"
          [[ "$(jq -r '.isDraft' <<<"$release")" == "false" ]]
          [[ "$(jq -r '.isPrerelease' <<<"$release")" == "false" ]]
          count="$(jq '[.assets[] | select(.name == "setup.bat" or .name == "setup-windows.bat" or .name == "setup-windows-arm64.bat" or .name == "setup-linux.sh" or .name == "setup-linux-arm64.sh" or .name == "setup-raspberry-pi.sh" or .name == "SHA256SUMS.txt")] | length' <<<"$release")"
          [[ "$count" -eq 7 ]] || { echo "Expected 7 installer assets, found $count" >&2; exit 1; }
          echo "Release verified: $(jq -r '.url' <<<"$release")"
