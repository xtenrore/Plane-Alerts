name: community-installer
run-name: Community matrix for Plane Alerts ${{ inputs.tested_sha || github.ref_name }}

on:
  # Only the dedicated automation branch or an explicit manual dispatch may
  # run the long community matrix. ordinary Railway pushes never trigger it.
  push:
    branches:
      - "automation/community-matrix-*"
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Exact commit to validate for community self-host release
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Resolve requested community candidate
        id: candidate
        shell: bash
        env:
          INPUT_TESTED_SHA: ${{ inputs.tested_sha }}
          EVENT_KIND: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_KIND" == "workflow_dispatch" ]]; then
            TARGET_SHA="$INPUT_TESTED_SHA"
          else
            PREFIX="automation/community-matrix-"
            [[ "$REF_NAME" == "$PREFIX"* ]] || { echo "Unexpected matrix trigger branch." >&2; exit 1; }
            TARGET_SHA="${REF_NAME#"$PREFIX"}"
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Candidate must be a full 40-character commit SHA." >&2; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"

  linux-x64:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Parse Linux installer entry points
        run: |
          bash -n setup-linux.sh
          bash -n setup-linux-arm64.sh
          bash -n setup-raspberry-pi.sh
      - name: Exercise native x64 guards and shared installer
        run: |
          bash setup-linux.sh --check-platform
          bash setup-linux.sh --self-test
          bash setup-linux-arm64.sh --self-test
          bash setup-raspberry-pi.sh --self-test
          python scripts/community_installer_v55.py --self-test
      - name: Run community installer and local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  linux-arm64:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies natively on ARM64
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Exercise native Linux ARM64 installer guard
        run: |
          bash setup-linux-arm64.sh --check-platform
          bash setup-linux-arm64.sh --self-test
          python scripts/community_installer_v55.py --self-test
      - name: Run native ARM64 community/local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  windows-x64:
    needs: resolve
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Exercise Windows installer guards
        shell: cmd
        run: |
          call setup.bat --self-test
          call setup-windows.bat --self-test
          call setup-windows.bat --check-platform
          call setup-windows-arm64.bat --self-test
      - name: Exercise shared installer
        run: python scripts/community_installer_v55.py --self-test
      - name: Run Windows community/local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  windows-arm64:
    needs: resolve
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies natively on ARM64
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Exercise native Windows ARM64 installer guard
        shell: cmd
        run: |
          call setup.bat --self-test
          call setup-windows-arm64.bat --check-platform
          call setup-windows-arm64.bat --self-test
          call setup-windows.bat --self-test
      - name: Exercise shared installer
        run: python scripts/community_installer_v55.py --self-test
      - name: Run native Windows ARM64 community/local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  raspberry-pi-arm64-emulation:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Exercise Raspberry Pi 5 64-bit platform guard under ARM64 QEMU
        run: |
          docker run --rm --platform linux/arm64 \
            -e PLANE_ALERTS_INSTALLER_TEST=1 \
            -e PLANE_ALERTS_TEST_ARCH=aarch64 \
            -e 'PLANE_ALERTS_TEST_MODEL=Raspberry Pi 5 Model B Rev 1.0' \
            -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/setup-raspberry-pi.sh --check-platform
      - name: Build ARM64 Plane Alerts image
        run: docker buildx build --platform linux/arm64 --build-arg TARGETARCH=arm64 --output=type=cacheonly .

  mongodb-upgrade:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0.14
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MONGO_URI: mongodb://127.0.0.1:27017
      DATABASE_NAME: plane_alerts_community_ci
      DATABASE_BACKEND: mongodb
      PLANE_STORAGE_MAINTENANCE_BACKGROUND: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tested_sha }}
      - name: Verify exact release candidate checkout
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$TESTED_SHA"
          echo "COMMUNITY_TESTED_SHA=$ACTUAL"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run real MongoDB community upgrade and privacy integration
        run: pytest -q tests/test_community_mongo_upgrade_integration.py
      - name: Verify dependency consistency
        run: pip check

  community-validation-summary:
    if: always()
    needs:
      - resolve
      - linux-x64
      - linux-arm64
      - windows-x64
      - windows-arm64
      - raspberry-pi-arm64-emulation
      - mongodb-upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every exact-commit community gate
        shell: bash
        env:
          TESTED_SHA: ${{ needs.resolve.outputs.tested_sha }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          LINUX_X64_RESULT: ${{ needs.linux-x64.result }}
          LINUX_ARM64_RESULT: ${{ needs.linux-arm64.result }}
          WINDOWS_X64_RESULT: ${{ needs.windows-x64.result }}
          WINDOWS_ARM64_RESULT: ${{ needs.windows-arm64.result }}
          PI_EMULATION_RESULT: ${{ needs.raspberry-pi-arm64-emulation.result }}
          MONGODB_RESULT: ${{ needs.mongodb-upgrade.result }}
        run: |
          set -euo pipefail
          [[ "$RESOLVE_RESULT" == "success" ]]
          [[ "$LINUX_X64_RESULT" == "success" ]]
          [[ "$LINUX_ARM64_RESULT" == "success" ]]
          [[ "$WINDOWS_X64_RESULT" == "success" ]]
          [[ "$WINDOWS_ARM64_RESULT" == "success" ]]
          [[ "$PI_EMULATION_RESULT" == "success" ]]
          [[ "$MONGODB_RESULT" == "success" ]]
          cat > community-validation.txt <<EOF
          tested_sha=$TESTED_SHA
          resolve=$RESOLVE_RESULT
          linux-x64=$LINUX_X64_RESULT
          linux-arm64=$LINUX_ARM64_RESULT
          windows-x64=$WINDOWS_X64_RESULT
          windows-arm64=$WINDOWS_ARM64_RESULT
          raspberry-pi-arm64-emulation=$PI_EMULATION_RESULT
          mongodb-upgrade=$MONGODB_RESULT
          EOF
          echo "COMMUNITY_MATRIX_TESTED_SHA=$TESTED_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: community-validation-${{ needs.resolve.outputs.tested_sha }}
          path: community-validation.txt
          if-no-files-found: error
