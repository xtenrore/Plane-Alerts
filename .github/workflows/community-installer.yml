name: community-installer

on:
  push:
    branches:
      - "release/community-self-hosting-v5.5"
      - "fix/community-installer/**"
  pull_request:
    paths:
      - "setup*.bat"
      - "setup*.sh"
      - "scripts/community_installer_v55.py"
      - "app/community_main_v55.py"
      - "app/doctor_v55.py"
      - "app/local_database_v55.py"
      - "app/local_adsb_coverage_v55.py"
      - ".env.example"
      - "requirements*.txt"
      - "tests/test_*v55.py"
      - ".github/workflows/community-installer.yml"

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Parse Linux installer entry points
        run: |
          bash -n setup-linux.sh
          bash -n setup-linux-arm64.sh
          bash -n setup-raspberry-pi.sh
      - name: Exercise native x64 guards and shared installer
        run: |
          bash setup-linux.sh --check-platform
          bash setup-linux.sh --self-test
          bash setup-linux-arm64.sh --self-test
          bash setup-raspberry-pi.sh --self-test
          python scripts/community_installer_v55.py --self-test
      - name: Run community installer and local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Exercise Windows installer guards
        shell: cmd
        run: |
          call setup.bat --self-test
          call setup-windows.bat --self-test
          call setup-windows.bat --check-platform
          call setup-windows-arm64.bat --self-test
      - name: Exercise shared installer
        run: python scripts/community_installer_v55.py --self-test
      - name: Run Windows community/local-storage regressions
        run: pytest -q tests/test_community_self_hosting_v55.py tests/test_local_database_v55.py tests/test_community_installer_v55.py
      - name: Verify dependency consistency
        run: pip check

  arm64-emulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Exercise generic ARM64 platform guard under QEMU
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/setup-linux-arm64.sh --check-platform
      - name: Exercise Raspberry Pi 5 64-bit guard under QEMU
        run: |
          docker run --rm --platform linux/arm64 \
            -e PLANE_ALERTS_INSTALLER_TEST=1 \
            -e PLANE_ALERTS_TEST_ARCH=aarch64 \
            -e 'PLANE_ALERTS_TEST_MODEL=Raspberry Pi 5 Model B Rev 1.0' \
            -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/setup-raspberry-pi.sh --check-platform
      - name: Build ARM64 Plane Alerts image
        run: docker buildx build --platform linux/arm64 --build-arg TARGETARCH=arm64 --output=type=cacheonly .
