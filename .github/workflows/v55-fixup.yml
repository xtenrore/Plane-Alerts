name: v55-fixup
on:
  push:
    branches: ["release/v5.5.0"]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v5.5.0
          fetch-depth: 0
      - run: python scripts/v55_fixup_once.py
      - run: |
          git config user.name plane-alerts-release-bot
          git config user.email actions@users.noreply.github.com
          git add app/sentinel_network.py tests/test_general_audit_fixes_v542.py tests/test_shadow_evaluation_v52.py tests/test_user_experience_v54.py
          git diff --cached --check
          git commit -m "Complete v5.5 outcome evidence and compatibility gates"
          git push origin HEAD:release/v5.5.0
