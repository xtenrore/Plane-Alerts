name: v55-fixup
on:
  push:
    branches: ["release/v5.5.0"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v5.5.0
          fetch-depth: 0
      - run: python scripts/v55_fixup_once.py
      - run: |
          rm -f scripts/v55_fixup_once.py .github/workflows/v55-fixup.yml
          git config user.name plane-alerts-release-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Complete v5.5 outcome evidence and compatibility gates"
          git push origin HEAD:release/v5.5.0
