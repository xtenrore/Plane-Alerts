name: v551-version-bump
on:
  push:
    branches: ["release/v5.5.1"]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v5.5.1
          fetch-depth: 0
      - run: python scripts/v551_bump_once.py
      - run: |
          git config user.name plane-alerts-release-bot
          git config user.email actions@users.noreply.github.com
          git add app/version.py README.md CHANGELOG.md docs/releases tests/test_general_audit_fixes_v542.py tests/test_user_experience_v54.py
          git diff --cached --check
          git commit -m "Advance file-backed Prediction Lab release to v5.5.1"
          git push origin HEAD:release/v5.5.1
