name: Sync Prediction Lab evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prediction-lab-sync.yml"
      - "app/prediction_lab_sync_bridge_v5610.py"
      - "app/admin/prediction_lab_sync_v5610.py"
      - "app/admin/routes.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prediction-lab-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      MAIN_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      MAX_FILES: "500"
      MAX_BYTES: "26214400"
      REQUIRED_BRIDGE_VERSION: "5.6.10"
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: prediction-lab-data
          fetch-depth: 0
          persist-credentials: true

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Load existing admin credential without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RAILWAY_TOKEN:-}" ]]; then
            echo "::error::Missing Railway project token."
            exit 1
          fi
          railway variable list --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$MAIN_SERVICE_ID" --json > /tmp/plane-alerts-variables.json
          python - <<'PY'
          import json, pathlib
          data=json.load(open('/tmp/plane-alerts-variables.json'))
          password=data.get('ADMIN_PASSWORD') if isinstance(data,dict) else None
          domain=data.get('RAILWAY_PUBLIC_DOMAIN') if isinstance(data,dict) else None
          if not isinstance(password,str) or not password.strip():
              raise SystemExit('ADMIN_PASSWORD is missing or unreadable; refusing unauthenticated sync')
          if '\n' in password or '\r' in password:
              raise SystemExit('ADMIN_PASSWORD contains unsupported newline characters')
          if not isinstance(domain,str) or not domain.strip():
              raise SystemExit('RAILWAY_PUBLIC_DOMAIN is missing; cannot reach production sync bridge')
          pathlib.Path('/tmp/plane-alerts-admin-password').write_text(password,encoding='utf-8')
          pathlib.Path('/tmp/plane-alerts-service-url').write_text('https://' + domain.strip().rstrip('/'),encoding='utf-8')
          PY
          chmod 600 /tmp/plane-alerts-admin-password /tmp/plane-alerts-service-url
          ADMIN_PASSWORD="$(cat /tmp/plane-alerts-admin-password)"
          echo "::add-mask::$ADMIN_PASSWORD"

      - name: Wait for exact deployed sync bridge
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASSWORD="$(cat /tmp/plane-alerts-admin-password)"
          SERVICE_URL="$(cat /tmp/plane-alerts-service-url)"
          READY=false
          for attempt in $(seq 1 72); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              --user "plane-alerts-sync:${ADMIN_PASSWORD}" \
              "$SERVICE_URL/admin/api/prediction-lab/sync-status" \
              --output /tmp/prediction-lab-sync-status.json; then
              FOUND_VERSION="$(python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/prediction-lab-sync-status.json'))
          except Exception:
              print('')
          else:
              print(data.get('bridge_version',''))
          PY
              )"
              if [[ "$FOUND_VERSION" == "$REQUIRED_BRIDGE_VERSION" ]]; then
                READY=true
                python - <<'PY'
          import json
          data=json.load(open('/tmp/prediction-lab-sync-status.json'))
          print(f"sync_bridge_ready version={data.get('bridge_version')} used_bytes={data.get('used_bytes')} free_bytes={data.get('free_bytes')}")
          PY
                break
              fi
            fi
            sleep 10
          done
          if [[ "$READY" != "true" ]]; then
            echo "::error::Exact Plane Alerts sync bridge did not become ready within the bounded deployment window."
            exit 1
          fi

      - name: Download bounded authenticated evidence batch
        shell: bash
        run: |
          set -euo pipefail
          ADMIN_PASSWORD="$(cat /tmp/plane-alerts-admin-password)"
          SERVICE_URL="$(cat /tmp/plane-alerts-service-url)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 180 --retry 2 \
            --user "plane-alerts-sync:${ADMIN_PASSWORD}" \
            "$SERVICE_URL/admin/api/prediction-lab/sync-batch?max_files=$MAX_FILES&max_bytes=$MAX_BYTES" \
            --output /tmp/prediction-lab-batch.zip

      - name: Independently validate and stage evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, re, shutil, zipfile

          archive=pathlib.Path('/tmp/prediction-lab-batch.zip')
          incoming=pathlib.Path('/tmp/prediction-lab-incoming')
          incoming.mkdir(parents=True,exist_ok=True)
          repo_root=pathlib.Path('prediction_lab')
          max_files=int('${{ env.MAX_FILES }}')
          max_bytes=int('${{ env.MAX_BYTES }}')
          forbidden=re.compile(r'(mongodb\+srv://|telegram[_-]?token|authorization\s*[=:]|api[_-]?key\s*[=:]|password\s*[=:])',re.I)

          with zipfile.ZipFile(archive,'r') as bundle:
              infos=bundle.infolist()
              names=[info.filename for info in infos]
              if len(names)!=len(set(names)):
                  raise SystemExit('duplicate ZIP member rejected')
              if 'manifest.json' not in names:
                  raise SystemExit('Prediction Lab batch manifest is missing')
              manifest=json.loads(bundle.read('manifest.json').decode('utf-8'))
              if manifest.get('schema')!='plane-alerts-prediction-sync-batch-v1':
                  raise SystemExit('unsupported Prediction Lab sync manifest')
              if manifest.get('bridge_version')!='${{ env.REQUIRED_BRIDGE_VERSION }}':
                  raise SystemExit('unexpected Prediction Lab sync bridge version')
              files=manifest.get('files')
              if not isinstance(files,list) or len(files)>max_files:
                  raise SystemExit('invalid or oversized Prediction Lab file manifest')
              expected_names={'manifest.json'}
              accepted=[]; total=0
              by_name={info.filename:info for info in infos}
              for item in files:
                  if not isinstance(item,dict):
                      raise SystemExit('invalid Prediction Lab manifest item')
                  relative=str(item.get('relative') or '').replace('\\','/')
                  posix=pathlib.PurePosixPath(relative)
                  if posix.is_absolute() or not relative.startswith('raw/') or '..' in posix.parts:
                      raise SystemExit(f'unsafe Prediction Lab evidence path: {relative}')
                  expected_sha=str(item.get('sha256') or '').lower()
                  expected_bytes=int(item.get('bytes') or 0)
                  if not re.fullmatch(r'[0-9a-f]{64}',expected_sha):
                      raise SystemExit(f'invalid SHA-256 for {relative}')
                  info=by_name.get(relative)
                  if info is None or info.is_dir() or info.file_size!=expected_bytes:
                      raise SystemExit(f'ZIP metadata mismatch for {relative}')
                  total += expected_bytes
                  if total>max_bytes:
                      raise SystemExit('Prediction Lab batch exceeds byte limit')
                  raw=bundle.read(relative)
                  if len(raw)!=expected_bytes or hashlib.sha256(raw).hexdigest()!=expected_sha:
                      raise SystemExit(f'Prediction Lab content hash mismatch for {relative}')
                  text=raw.decode('utf-8')
                  if forbidden.search(text):
                      raise SystemExit(f'credential-like material rejected: {relative}')
                  if relative.endswith('.json'):
                      payload=json.loads(text)
                      if not isinstance(payload,dict) or payload.get('schema')!='plane-alerts-prediction-evidence-v1':
                          raise SystemExit(f'unsupported evidence schema: {relative}')
                  elif relative.endswith('.ndjson'):
                      rows=0
                      for line in text.splitlines():
                          if not line.strip(): continue
                          payload=json.loads(line); rows+=1
                          if not isinstance(payload,dict) or payload.get('schema')!='plane-alerts-prediction-evidence-v1':
                              raise SystemExit(f'unsupported evidence schema in bundle: {relative}')
                      if rows==0:
                          raise SystemExit(f'empty evidence bundle rejected: {relative}')
                  else:
                      raise SystemExit(f'unsupported evidence extension: {relative}')
                  target=repo_root/pathlib.Path(*posix.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  if target.exists():
                      if hashlib.sha256(target.read_bytes()).hexdigest()!=expected_sha:
                          raise SystemExit(f'conflicting evidence path: {target}')
                  else:
                      target.write_bytes(raw)
                  expected_names.add(relative)
                  accepted.append({'relative':relative,'bytes':expected_bytes,'sha256':expected_sha})
              if set(names)!=expected_names:
                  raise SystemExit('unexpected ZIP members rejected')

          pathlib.Path('/tmp/prediction-lab-accepted.json').write_text(json.dumps(accepted,sort_keys=True),encoding='utf-8')
          print(f'validated files={len(accepted)} bytes={total}')
          PY
          git config user.name "plane-alerts-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_lab/raw 2>/dev/null || true

      - name: Commit and push evidence
        id: push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No new repository evidence to commit; validating existing bytes was sufficient."
          else
            git commit -m "Prediction Lab evidence sync"
            if ! git pull --rebase origin prediction-lab-data; then
              git rebase --abort || true
              echo "::error::Evidence branch changed concurrently; refusing to acknowledge spool files."
              exit 1
            fi
            git push origin HEAD:prediction-lab-data
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Acknowledge only repository-verified evidence
        if: steps.push.outputs.ok == 'true'
        id: acknowledge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          accepted=json.load(open('/tmp/prediction-lab-accepted.json'))
          with open('/tmp/prediction-lab-ack.json','w',encoding='utf-8') as handle:
              json.dump({'files':accepted},handle,separators=(',',':'))
          PY
          ADMIN_PASSWORD="$(cat /tmp/plane-alerts-admin-password)"
          SERVICE_URL="$(cat /tmp/plane-alerts-service-url)"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 120 \
            --user "plane-alerts-sync:${ADMIN_PASSWORD}" \
            --header "Content-Type: application/json" \
            --request POST \
            --data-binary @/tmp/prediction-lab-ack.json \
            "$SERVICE_URL/admin/api/prediction-lab/sync-ack" \
            --output /tmp/prediction-lab-ack-response.json
          python - <<'PY'
          import json, os
          accepted=json.load(open('/tmp/prediction-lab-accepted.json'))
          response=json.load(open('/tmp/prediction-lab-ack-response.json'))
          removed=int(response.get('removed_files',-1))
          if removed!=len(accepted):
              raise SystemExit(f'acknowledgement count mismatch: accepted={len(accepted)} removed={removed}')
          print(f"acknowledged_and_removed files={removed} bytes={response.get('removed_bytes')} free_bytes={response.get('free_bytes')}")
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'count={removed}\n')
              handle.write(f'continue_drain={"true" if removed >= 250 else "false"}\n')
          PY

      - name: Continue draining a saturated backlog
        if: steps.acknowledge.outputs.continue_drain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Large repository-acknowledged batch removed; dispatching the next bounded drain pass."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/prediction-lab-sync.yml/dispatches" -f ref=main
