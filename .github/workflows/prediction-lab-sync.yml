name: Sync Prediction Lab evidence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prediction-lab-sync.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: prediction-lab-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: 167a00b7-c56c-4cbb-9f24-3daded12443c
      ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6
      MAIN_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      MAX_FILES: "500"
      MAX_BYTES: "26214400"
      TRANSFER_WORKERS: "12"
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: prediction-lab-data
          fetch-depth: 0
          persist-credentials: true

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Resolve Railway authentication
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RAILWAY_TOKEN:-}" ]]; then exit 0; fi
          if [[ -z "${RAILWAY_API_TOKEN:-}" ]]; then
            echo "::error::Missing Railway authentication secret."
            exit 1
          fi
          echo "RAILWAY_TOKEN=${RAILWAY_API_TOKEN}" >> "$GITHUB_ENV"
          echo "RAILWAY_API_TOKEN=" >> "$GITHUB_ENV"

      - name: Find Prediction Lab volume
        id: volume
        shell: bash
        run: |
          set -euo pipefail
          railway volume --project "$PROJECT_ID" --environment "$ENVIRONMENT_ID" --service "$MAIN_SERVICE_ID" list --json > /tmp/volumes.json
          VOLUME_ID="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/volumes.json'))
          matches=[]
          def walk(value):
              if isinstance(value, dict):
                  text=' '.join(str(value.get(k,'')) for k in ('mountPath','mount_path','path'))
                  if '/data/prediction_lab' in text:
                      ident=value.get('id') or value.get('volumeId') or value.get('volume_id') or value.get('name')
                      if ident: matches.append(str(ident))
                  for child in value.values(): walk(child)
              elif isinstance(value, list):
                  for child in value: walk(child)
          walk(data)
          print(matches[0] if matches else '')
          PY
          )"
          if [[ -z "$VOLUME_ID" ]]; then
            echo "Prediction Lab volume is not attached yet; nothing to sync."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "id=$VOLUME_ID" >> "$GITHUB_OUTPUT"

      - name: Download bounded evidence batch
        if: steps.volume.outputs.available == 'true'
        shell: bash
        env:
          VOLUME_ID: ${{ steps.volume.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/prediction-lab-incoming
          python - <<'PY'
          import concurrent.futures, json, os, pathlib, subprocess

          volume=os.environ['VOLUME_ID']; project=os.environ['PROJECT_ID']; environment=os.environ['ENVIRONMENT_ID']; service=os.environ['MAIN_SERVICE_ID']
          max_files=int(os.environ['MAX_FILES']); max_bytes=int(os.environ['MAX_BYTES']); workers=max(1,min(16,int(os.environ['TRANSFER_WORKERS'])))
          root=pathlib.Path('/tmp/prediction-lab-incoming')
          chosen=[]; estimated_bytes=0

          def cmd(*args):
              return ['railway','volume','--project',project,'--environment',environment,'--service',service,'files','--volume',volume,*args]

          def list_dir(remote):
              try:
                  raw=subprocess.check_output(cmd('list',remote,'--json'), text=True, stderr=subprocess.STDOUT)
                  data=json.loads(raw)
              except (subprocess.CalledProcessError, json.JSONDecodeError) as exc:
                  raise SystemExit(f'volume listing failed for {remote}: {type(exc).__name__}') from exc
              files=data.get('files') if isinstance(data,dict) else None
              if not isinstance(files,list):
                  raise SystemExit(f'malformed Railway volume listing for {remote}: missing files[]')
              entries=[]
              base=pathlib.PurePosixPath(remote if remote.startswith('/') else '/' + remote)
              for value in files:
                  if not isinstance(value,dict):
                      continue
                  name=str(value.get('name') or '').strip()
                  if not name or name in {'.','..'}:
                      continue
                  kind=str(value.get('type') or value.get('kind') or '').strip().lower()
                  size=value.get('size') or value.get('bytes') or 0
                  try: size=int(size or 0)
                  except (TypeError,ValueError): size=0
                  # Railway may expose a mount-absolute `path`. File operations,
                  # however, are rooted at the selected volume, so always rebuild
                  # the child remote path from the directory we actually listed.
                  path=str(base / name)
                  is_dir=kind in {'dir','directory','folder'} or (not kind and '.' not in name and size == 0)
                  entries.append((path,is_dir,size))
              print(f'volume listing remote={remote} entries={len(entries)}')
              return entries

          def collect_tree(start):
              global estimated_bytes
              stack=[start]; visited=set()
              while stack and len(chosen)<max_files:
                  current=stack.pop(0)
                  if current in visited:
                      continue
                  visited.add(current)
                  for path,is_dir,size in sorted(list_dir(current)):
                      name=pathlib.PurePosixPath(path).name
                      if is_dir:
                          stack.append(path.rstrip('/'))
                          continue
                      if name.startswith('.') or path.endswith('.synced'):
                          continue
                      if not (path.endswith('.json') or path.endswith('.ndjson')):
                          continue
                      if chosen and size > 0 and estimated_bytes + size > max_bytes:
                          return
                      if size > max_bytes:
                          raise SystemExit(f'single evidence file exceeds bounded sync size: {path} ({size})')
                      chosen.append((path,size))
                      estimated_bytes += max(0,size)
                      if len(chosen)>=max_files:
                          return

          def archive_is_verified():
              remote='/archive/mongo-import/manifest.json'
              local=root/'__archive_manifest_probe.json'
              try:
                  subprocess.check_call(cmd('download',remote,str(local),'--overwrite'), stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  payload=json.loads(local.read_text(encoding='utf-8'))
                  return payload.get('verified') is True
              except (subprocess.CalledProcessError, OSError, json.JSONDecodeError):
                  return False
              finally:
                  local.unlink(missing_ok=True)

          if archive_is_verified():
              collect_tree('/archive/mongo-import')
          else:
              print('historical archive is not verified yet; skipping archive sync this run')
          if len(chosen)<max_files and estimated_bytes<max_bytes:
              collect_tree('/raw')

          print(f'bounded sync candidates files={len(chosen)} estimated_bytes={estimated_bytes}')

          def download(item):
              remote,_=item
              rel=remote.lstrip('/'); local=root/rel; local.parent.mkdir(parents=True, exist_ok=True)
              subprocess.check_call(cmd('download',remote,str(local),'--overwrite'), stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return remote,rel,local.stat().st_size

          downloaded=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
              futures=[pool.submit(download,item) for item in chosen]
              for future in concurrent.futures.as_completed(futures):
                  downloaded.append(future.result())

          manifest=[]; total=0
          for remote,rel,size in sorted(downloaded):
              local=root/rel
              if manifest and total+size>max_bytes:
                  local.unlink(missing_ok=True)
                  continue
              if size>max_bytes:
                  raise SystemExit(f'single evidence file exceeds bounded sync size: {remote} ({size})')
              total+=size; manifest.append({'remote':remote,'relative':rel,'bytes':size})
          (root/'manifest.json').write_text(json.dumps(manifest,sort_keys=True),encoding='utf-8')
          print(f'bounded sync selected files={len(manifest)} bytes={total}')
          PY

      - name: Validate and stage evidence
        if: steps.volume.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, re, shutil
          incoming=pathlib.Path('/tmp/prediction-lab-incoming')
          manifest=json.loads((incoming/'manifest.json').read_text()) if (incoming/'manifest.json').exists() else []
          root=pathlib.Path('prediction_lab')
          forbidden=re.compile(r'(mongodb\+srv://|telegram[_-]?token|authorization\s*[=:]|api[_-]?key\s*[=:]|password\s*[=:])',re.I)
          accepted=[]
          for item in manifest:
              source=incoming/item['relative']; raw=source.read_text(encoding='utf-8')
              if forbidden.search(raw): raise SystemExit(f'credential-like material rejected: {item["relative"]}')
              if source.suffix=='.json':
                  parsed=json.loads(raw)
                  if item['relative'].startswith('raw/') and parsed.get('schema')!='plane-alerts-prediction-evidence-v1': raise SystemExit(f'unsupported evidence schema: {item["relative"]}')
              else:
                  for line in raw.splitlines():
                      if not line.strip():
                          continue
                      parsed=json.loads(line)
                      if item['relative'].startswith('raw/') and parsed.get('schema')!='plane-alerts-prediction-evidence-v1': raise SystemExit(f'unsupported evidence schema in bundle: {item["relative"]}')
              target=root/item['relative']; target.parent.mkdir(parents=True,exist_ok=True)
              if target.exists():
                  if hashlib.sha256(target.read_bytes()).digest()!=hashlib.sha256(source.read_bytes()).digest(): raise SystemExit(f'conflicting evidence path: {target}')
              else: shutil.copy2(source,target)
              accepted.append(item)
          pathlib.Path('/tmp/prediction-lab-accepted.json').write_text(json.dumps(accepted),encoding='utf-8')
          print(f'validated files={len(accepted)}')
          PY
          git config user.name "plane-alerts-evidence"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prediction_lab/raw prediction_lab/archive/mongo-import 2>/dev/null || true

      - name: Commit and push evidence
        if: steps.volume.outputs.available == 'true'
        id: push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "No new repository evidence to commit."
          else
            git commit -m "Prediction Lab evidence sync"
            if ! git pull --rebase origin prediction-lab-data; then
              git rebase --abort || true
              echo "::error::Evidence branch changed concurrently; refusing to acknowledge spool files."
              exit 1
            fi
            git push origin HEAD:prediction-lab-data
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Remove repository-acknowledged spool files
        if: steps.volume.outputs.available == 'true' && steps.push.outputs.ok == 'true'
        id: acknowledge
        shell: bash
        env:
          VOLUME_ID: ${{ steps.volume.outputs.id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import concurrent.futures, json, os, pathlib, subprocess
          accepted=json.load(open('/tmp/prediction-lab-accepted.json')) if pathlib.Path('/tmp/prediction-lab-accepted.json').exists() else []
          volume=os.environ['VOLUME_ID']; project=os.environ['PROJECT_ID']; environment=os.environ['ENVIRONMENT_ID']; service=os.environ['MAIN_SERVICE_ID']
          workers=max(1,min(16,int(os.environ['TRANSFER_WORKERS'])))
          max_files=int(os.environ['MAX_FILES'])
          def remove_acknowledged(item):
              old=item['remote']
              subprocess.check_call(['railway','volume','--project',project,'--environment',environment,'--service',service,'files','--volume',volume,'delete',old,'--yes','--json'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return old
          with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
              futures=[pool.submit(remove_acknowledged,item) for item in accepted]
              for future in concurrent.futures.as_completed(futures):
                  future.result()
          count=len(accepted)
          print(f'acknowledged_and_removed files={count}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f'count={count}\n')
              handle.write(f'continue_drain={"true" if count >= max(100, max_files // 2) else "false"}\n')
          PY

      - name: Continue draining a saturated backlog
        if: steps.acknowledge.outputs.continue_drain == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Large acknowledged batch removed; dispatching the next bounded drain pass."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/prediction-lab-sync.yml/dispatches" -f ref=main
