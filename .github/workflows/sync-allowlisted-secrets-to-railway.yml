name: Sync allowlisted Plane Alerts secrets to Railway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-allowlisted-plane-alerts-secrets-to-railway
  cancel-in-progress: false

jobs:
  sync:
    name: Sync 32 allowlisted secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Use the existing Railway project token. The fallback preserves compatibility
      # with the repository's older secret naming without exposing either value.
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN || secrets.RAILWAY_API_TOKEN }}

      # Existing Plane Alerts production target.
      RAILWAY_SERVICE_ID: af7f738d-0a49-4b86-a96a-86cf22f1b4db
      RAILWAY_ENVIRONMENT_ID: 092b0d8c-cfd9-44d4-9f25-64795ea634d6

      # Exact 32-secret allowlist requested by the owner.
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      AI_OPS_GITHUB_DR_TOKEN: ${{ secrets.AI_OPS_GITHUB_DR_TOKEN }}
      BACK4APP_API: ${{ secrets.BACK4APP_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      COHERE_TRIAL_KEY: ${{ secrets.COHERE_TRIAL_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GOOGLE_CONTRAILS_API_KEY: ${{ secrets.GOOGLE_CONTRAILS_API_KEY }}
      GROQ_KEY: ${{ secrets.GROQ_KEY }}
      GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
      GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
      GROQ_KEY_4: ${{ secrets.GROQ_KEY_4 }}
      GROQ_KEY_5: ${{ secrets.GROQ_KEY_5 }}
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      MISTRAL_API_2: ${{ secrets.MISTRAL_API_2 }}
      MISTRAL_API_3: ${{ secrets.MISTRAL_API_3 }}
      MISTRAL_API_4: ${{ secrets.MISTRAL_API_4 }}
      MISTRAL_API_5: ${{ secrets.MISTRAL_API_5 }}
      MONGO_URI: ${{ secrets.MONGO_URI }}
      NF_API_TOKEN: ${{ secrets.NF_API_TOKEN }}
      OPENROUTER_API: ${{ secrets.OPENROUTER_API }}
      OPENSKY_1: ${{ secrets.OPENSKY_1 }}
      OPENSKY_2: ${{ secrets.OPENSKY_2 }}
      OPENSKY_3: ${{ secrets.OPENSKY_3 }}
      OPENSKY_4: ${{ secrets.OPENSKY_4 }}
      OPENSKY_5: ${{ secrets.OPENSKY_5 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required files and auth are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}" || {
            echo "::error::Missing RAILWAY_TOKEN/RAILWAY_API_TOKEN repository secret."
            exit 1
          }
          test -f .github/workflows/sync_allowlisted_secrets_to_railway.sh || {
            echo "::error::Missing .github/workflows/sync_allowlisted_secrets_to_railway.sh"
            exit 1
          }

      - name: Install Railway CLI
        shell: bash
        run: npm install --global @railway/cli >/dev/null

      - name: Run strict allowlisted secret sync
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .github/workflows/sync_allowlisted_secrets_to_railway.sh
          .github/workflows/sync_allowlisted_secrets_to_railway.sh

      - name: Confirm completion
        shell: bash
        run: |
          echo "Allowlisted Railway secret sync completed successfully."
          echo "No secret values were printed."
